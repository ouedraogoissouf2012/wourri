# Wourri — CI du front de l'atelier LQE (wouri-lqe-web).
# ──────────────────────────────────────────────────────
#
# Aucun workflow ne couvrait `wouri-lqe-web/` : ci-lqe.yml ne lance que pytest sur
# `wouri-lqe/`, ci-convex.yml est filtre sur `convex/**` et utilise pnpm a la racine.
# Le front est un paquet npm autonome (package-lock.json, `npm ci` dans son Dockerfile)
# → CI separee. Dette #492.
#
# Node 22 : meme version que l'etage de build du Dockerfile (node:22-alpine).

name: ci-lqe-web

on:
  push:
    branches: [APIPy]
    paths:
      - 'wouri-lqe-web/**'
      - '.github/workflows/ci-lqe-web.yml'
  pull_request:
    branches: [APIPy]
    paths:
      - 'wouri-lqe-web/**'
      - '.github/workflows/ci-lqe-web.yml'

jobs:
  test-lqe-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: wouri-lqe-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wouri-lqe-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run Vitest
        run: npm run test

      - name: Build
        run: npm run build

  # ADR-0051 / #621 : aucun fichier de code au-dessus de 300 lignes logiques, et la
  # liste d'exemptions (scripts/line_budget.json) ne peut que diminuer. Le job mesure
  # TOUT le dépôt, pas le seul sous-arbre de ce workflow ; il est identique dans
  # ci-api.yml, ci-lqe.yml et ci-lqe-web.yml (tests/unit/test_line_budget_ci.py).
  line-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull_request : HEAD est la fusion de test, HEAD^1 la pointe de la base.
          fetch-depth: 2

      - name: Fetch push base
        # push : la base est l'état de la branche avant la poussée.
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check logical-line ceiling (ADR-0051)
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: python scripts/check_line_budget.py --baseline "$BASELINE"
