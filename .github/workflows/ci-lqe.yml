# Wourri — CI tests du service LQE (wouri-lqe).
# ───────────────────────────────────────────────
#
# Le moteur (ci-api.yml) impose `testpaths = tests` → `wouri-lqe/tests`
# n'y est jamais exécuté. Service séparé → CI séparée.
# Depuis ADR-0034 (P0), l'atelier a une couche PostgreSQL + pgvector : on
# fournit un service Postgres éphémère pour les tests de la base.

name: ci-lqe

on:
  push:
    branches: [APIPy]
    paths:
      - 'wouri-lqe/**'
      - '.github/workflows/ci-lqe.yml'
  pull_request:
    branches: [APIPy]
    paths:
      - 'wouri-lqe/**'
      - '.github/workflows/ci-lqe.yml'

jobs:
  test-lqe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wourri
          POSTGRES_PASSWORD: wourri_test
          POSTGRES_DB: wourri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wourri -d wourri_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: wourri
      POSTGRES_PASSWORD: wourri_test
      POSTGRES_DB: wourri_test
      LQE_DB_SCHEMA: lqe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wouri-lqe/requirements.txt

      - name: Install deps
        working-directory: wouri-lqe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: wouri-lqe
        run: pytest tests -q --tb=short
