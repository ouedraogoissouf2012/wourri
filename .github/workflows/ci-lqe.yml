# Wourri — CI tests du service LQE (wouri-lqe).
# ───────────────────────────────────────────────
#
# Le moteur (ci-api.yml) impose `testpaths = tests` → `wouri-lqe/tests`
# n'y est jamais exécuté. Service séparé → CI séparée.
# Depuis ADR-0034 (P0), l'atelier a une couche PostgreSQL + pgvector : on
# fournit un service Postgres éphémère pour les tests de la base.

name: ci-lqe

on:
  push:
    branches: [APIPy]
    paths:
      - 'wouri-lqe/**'
      - 'tools/pytest/**'  # la garde de la base (#638) est chargée par cette suite
      - '.github/workflows/ci-lqe.yml'
  pull_request:
    branches: [APIPy]
    paths:
      - 'wouri-lqe/**'
      - 'tools/pytest/**'  # la garde de la base (#638) est chargée par cette suite
      - '.github/workflows/ci-lqe.yml'

jobs:
  test-lqe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wourri
          POSTGRES_PASSWORD: wourri_test
          POSTGRES_DB: wourri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wourri -d wourri_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: wourri
      POSTGRES_PASSWORD: wourri_test
      POSTGRES_DB: wourri_test
      LQE_DB_SCHEMA: lqe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wouri-lqe/requirements.txt

      - name: Install deps
        working-directory: wouri-lqe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: wouri-lqe
        run: pytest tests -q --tb=short

  # ADR-0051 / #621 : aucun fichier de code au-dessus de 300 lignes logiques, et la
  # liste d'exemptions (scripts/line_budget.json) ne peut que diminuer. Le job mesure
  # TOUT le dépôt, pas le seul sous-arbre de ce workflow ; il est identique dans
  # ci-api.yml, ci-lqe.yml et ci-lqe-web.yml (tests/unit/test_line_budget_ci.py).
  line-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull_request : HEAD est la fusion de test, HEAD^1 la pointe de la base.
          fetch-depth: 2

      - name: Fetch push base
        # push : la base est l'état de la branche avant la poussée.
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BEFORE"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check logical-line ceiling (ADR-0051)
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: python scripts/check_line_budget.py --baseline "$BASELINE"
