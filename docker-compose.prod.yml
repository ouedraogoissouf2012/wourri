# Wourri — Orchestration production (Sprint I.c, issue #201).
# ─────────────────────────────────────────────────────────────
#
# Usage sur la VM Scaleway (chemin canonique `/srv/wourri/`) :
#
#   # 1. Première installation (cf. docs/deployment.md)
#   sudo mkdir -p /srv/wourri && sudo chown $USER:$USER /srv/wourri
#   # ... scp docker-compose.prod.yml + db-init/ + .env.prod sur la VM ...
#
#   # 2. Démarrer / mettre à jour (workflow déploiement)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm wouri-api /app/scripts/run_migrations.sh
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
#   # 3. Logs / debug
#   docker compose -f docker-compose.prod.yml logs -f wouri-api whatsapp-server
#
# Décisions tranchées (cf. ADR + plan Sprint I) :
#   - 3 services : postgres (pgvector/pg16) + wouri-api + whatsapp-server
#   - Images depuis ghcr.io (push par CI à chaque merge sur APIPy / whatsappServeur)
#   - Aucun build local en prod : le serveur fait juste `pull && up -d`
#   - Tous ports bindés sur `127.0.0.1:` (défense en profondeur — reverse proxy
#     futur en Sprint J s'ouvrira sur 443)
#   - Postgres self-hosted (Scaleway Managed = ~30€/mois, injustifié pour ~30 users staging)
#   - Volumes nommés `wourri_*` (collisions exclues avec autres projets Docker)

services:
  # ╭──────────────────────────────────────────────────────────────────────╮
  # │ PostgreSQL + pgvector (cohérent avec docker-compose.dev.yml)         │
  # ╰──────────────────────────────────────────────────────────────────────╯
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wourri_postgres_prod
    restart: unless-stopped
    # Sprint I.c.1 review SEC M3 : no-new-privileges empêche tout exploit
    # in-container d'escalader vers root host (setuid binaries).
    security_opt:
      - "no-new-privileges:true"
    # Sprint I.c.1 review OPS M1 : limite mémoire stricte. Postgres tient
    # confortablement en 512m pour ~30 utilisateurs (heuristique pgvector
    # léger sur le corpus IVR courant + tables annexes).
    mem_limit: 512m
    mem_reservation: 256m
    # Sprint I.c.1 review OPS M2 : rotation logs Docker pour éviter
    # saturation du disque sur la VM (40 GB Scaleway DEV1-M).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Pas d'exposition host : Postgres reste interne au réseau Docker.
    # Pour debug ad-hoc depuis la VM : `docker compose exec postgres psql -U $POSTGRES_USER`.
    # Pour accès distant : tunnel SSH ponctuel (cf. runbook).
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env.prod}
      # Issue #213 : Docker secret monté en read-only dans /run/secrets/.
      # L'image postgres lit nativement POSTGRES_PASSWORD_FILE → ne touche
      # PAS POSTGRES_PASSWORD ici (sinon les 2 sont en conflit).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-wourri_prod}
      # Sprint I.c.1 review OPS M3 : TZ UTC partout pour aligner les logs
      # des 3 services lors du debug (jamais Europe/Paris : DST = pièges).
      TZ: UTC
    secrets:
      - postgres_password
    volumes:
      # Issue #218 (Sprint I.c.1 review OPS MAJOR M7) : bind-mount explicite
      # vers /srv/wourri/data/postgres (vs named volume cache dans
      # /var/lib/docker/volumes/...). Benefice : visibilite `df -h`, backup
      # rsync direct, migration disque dedie facile a posteriori.
      # Prerequis : creer le dossier avec chown 999:999 (UID image postgres
      # officielle pgvector/pgvector:pg16) — cf. docs/deployment.md §4.
      - /srv/wourri/data/postgres:/var/lib/postgresql/data
      # db-init/init.sql crée l'extension `vector` au PREMIER démarrage
      # (mécanisme docker-entrypoint-initdb.d). Doit être présent sur la VM.
      # Read-only pour empêcher modification accidentelle depuis le container.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-wourri_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wourri_net

  # ╭──────────────────────────────────────────────────────────────────────╮
  # │ wouri-api (FastAPI + modèles ML)                                     │
  # ╰──────────────────────────────────────────────────────────────────────╯
  wouri-api:
    image: ghcr.io/ouedraogoissouf2012/wourri-api:${API_IMAGE_TAG:-latest}
    container_name: wourri_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Sprint I.c.1 review SEC M3 : no-new-privileges (cf. postgres ci-dessus).
    security_opt:
      - "no-new-privileges:true"
    # Sprint I.c.1 review OPS M1 : 3 GB pour absorber Whisper + NLLB + MMS-dyu
    # chargés en mémoire (~2.5 GB RSS observé, marge +500m). Sur DEV1-M (4 GB
    # RAM totale), il reste 1 GB pour postgres + wa + OS + swap → OOM-safe.
    mem_limit: 3g
    mem_reservation: 1500m
    # Sprint I.c.1 review OPS M2 : rotation logs Docker.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bind 127.0.0.1 uniquement : seul le reverse proxy futur (Sprint J)
    # pourra exposer ce port en 443. Empêche tout accès direct depuis Internet.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Issue #258 : URL assemblée PAR L'APPLICATION (app/db/url_resolver.py)
      # depuis les composants ci-dessous + le Docker secret postgres_password.
      # Fini la duplication du mot de passe (avant : 1× secret pour postgres,
      # 1× ${POSTGRES_PASSWORD} interpolé ici, visible docker inspect).
      # Host = nom du service Docker (`postgres`, pas localhost) ; le driver
      # `+psycopg` (psycopg 3.x) est fixé par url_resolver.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:-wourri_prod}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Active les garde-fous Settings : secret API obligatoire, debug force off
      # et CORS production. Sans cette valeur, l'application restait en mode dev.
      ENV: production
      # NOTE (#203) : CORPUS_STORAGE_MODE retiré — pgvector est le backend
      # corpus unique (ADR-0008 Phase E terminée, ChromaDB supprimé). Une
      # valeur résiduelle dans .env.prod est ignorée par l'app.
      # Sprint I.c.1 review OPS M3 : TZ UTC partout.
      TZ: UTC
      # Issues #213 + #222 + #259 : les DEUX cles (courante + precedente) en
      # Docker secrets — plus aucune cle en clair dans l'environnement.
      #
      # - API_SECRET_KEY_FILE : cle courante, lue par _read_file_secret()
      #   dans app/config.py (override `api_secret_key` au demarrage).
      #   Renommage WOURI_API_KEY → API_SECRET_KEY introduit en PR #245 (issue #222).
      # - API_SECRET_KEY_PREVIOUS_FILE (#259) : cle precedente pour la fenetre
      #   de rotation dual-key. Le fichier existe TOUJOURS (cree VIDE a
      #   l'installation, cf. deployment.md §5b) : vide = pas de rotation en
      #   cours ; rempli ~5 min pendant une rotation zero-downtime.
      # - API_SECRET_KEY_PREVIOUS (env) : fallback legacy conserve — utilise
      #   seulement si le fichier est vide/absent.
      API_SECRET_KEY_FILE: /run/secrets/api_secret_key
      API_SECRET_KEY_PREVIOUS_FILE: /run/secrets/api_secret_key_previous
      API_SECRET_KEY_PREVIOUS: ${WOURI_API_KEY_PREVIOUS:-}
      # CORS : laisser vide pour mode strict (pas de frontend web en Sprint I).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Issue #215 / ADR-0025 : rétention des logs PII (purge quotidienne
      # in-app). Justifications : docs/compliance/artci-logs.md.
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      FEEDBACK_RETENTION_DAYS: ${FEEDBACK_RETENTION_DAYS:-365}
      # HuggingFace cache : pointe vers le volume monté
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
    secrets:
      # Issue #213 : monte en read-only dans /run/secrets/ du container.
      - api_secret_key
      # Issue #258 : même secret que le service postgres — un seul point de
      # vérité pour le mot de passe (url_resolver lit POSTGRES_PASSWORD_FILE).
      - postgres_password
      # Issue #259 : cle precedente (fichier vide hors fenetre de rotation).
      - api_secret_key_previous
    volumes:
      # Cache modèles ML : volume nommé persistant. Évite re-téléchargement
      # de PyTorch + Whisper + NLLB + MMS-dyu à chaque redéploiement.
      - hf_cache:/app/.cache/huggingface
      # Audio output (TTS générés) : persistant pour servir aux clients
      - audio_output:/app/static/audio
      - api_logs:/app/logs
    healthcheck:
      # Issue #217 : start_period 120s (2 min) — les modèles essentiels (TTS
      # bambara/dioula, NLLB, embedding multilingual) sont préchargés dans
      # l'image au build (cf. Dockerfile.prod). Cold-start ~30 s + marge pour
      # Whisper/NeMo lazy. Avant : 900s pour absorber download HF de 3-4 GB.
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - wourri_net

  # ╭──────────────────────────────────────────────────────────────────────╮
  # │ whatsapp-server (Node.js + Baileys)                                  │
  # ╰──────────────────────────────────────────────────────────────────────╯
  whatsapp-server:
    image: ghcr.io/ouedraogoissouf2012/wourri-whatsapp:${WA_IMAGE_TAG:-latest}
    container_name: wourri_whatsapp_prod
    restart: unless-stopped
    depends_on:
      wouri-api:
        condition: service_healthy
    # Sprint I.c.1 review SEC M3 : no-new-privileges (cf. postgres ci-dessus).
    security_opt:
      - "no-new-privileges:true"
    # Sprint I.c.1 review OPS M1 : 512m suffit (Baileys + Express, pas de ML).
    mem_limit: 512m
    mem_reservation: 256m
    # Sprint I.c.1 review OPS M2 : rotation logs Docker.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Bind 127.0.0.1 : pour scanner le QR code initial, utiliser un tunnel SSH :
    #   ssh -L 3001:127.0.0.1:3001 user@vm-scaleway
    #   → puis ouvrir http://localhost:3001/qr-page dans le navigateur local.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # URL backend : host = nom du service Docker (réseau interne).
      WOURI_API_URL: http://wouri-api:8000
      # Issue #257 : pattern Docker secrets aligné sur wouri-api (#213).
      # lib/secrets.js::readSecret lit le fichier (prioritaire, trim) avec
      # fallback env WOURI_API_KEY — plus de clé en clair dans l'environnement
      # (invisible dans docker inspect / compose config).
      WOURI_API_KEY_FILE: /run/secrets/wouri_api_key
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sprint I.c.1 review OPS M3 : TZ UTC partout.
      TZ: UTC
      # Chemins override pour pointer vers /app/data (volume nommé persistant).
      # Cf. Sprint I.b — sans ces ENV, les fichiers étaient écrits à la racine
      # /app/ et perdus à chaque restart. Les ENV sont aussi dans Dockerfile.prod
      # (défense en profondeur — un opérateur qui copie ce compose ailleurs aura
      # quand même les bons chemins).
      USER_PREFS_FILE: /app/data/user_preferences.json
      PENDING_MESSAGES_FILE: /app/data/pending_messages.json
    secrets:
      # Issue #257 : la clé du whatsapp-server EST la clé API (contrat
      # X-API-Key, ADR-0012) → on RÉUTILISE l'unique secret api_secret_key
      # sous un alias local (target). Un seul secret déclaré → impossible de
      # faire diverger les deux clés par un chemin dupliqué.
      - source: api_secret_key
        target: wouri_api_key
    volumes:
      # auth_baileys : session WhatsApp persistante. PERTE = re-scan QR manuel.
      - wa_auth:/app/auth_baileys
      # audio_cache : 4 audios excuse pré-générés. PERTE = régénérés au boot
      # (latence ~5s × 4 si API healthy, fallback texte sinon).
      - wa_audio_cache:/app/audio_cache
      # data/ : user_preferences.json + pending_messages.json (cf. Sprint I.b).
      - wa_data:/app/data
      # wa_logs : AUCUN écrivain (pino loggue sur stdout — lib/logger.js).
      # Conservé uniquement parce que l'image déclare VOLUME /app/logs
      # (Dockerfile.prod:85, branche whatsappServeur) : sans montage nommé,
      # Docker créerait un volume ANONYME orphelin à chaque redeploy.
      # Suppression complète = retirer d'abord la directive VOLUME côté
      # whatsappServeur (tracé ADR-0025). Rétention : n/a (volume vide).
      - wa_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # start_period court : Baileys + Express ~5-10s. Pas de modèle ML lourd.
      start_period: 30s
    networks:
      - wourri_net

# ╭──────────────────────────────────────────────────────────────────────╮
# │ Volumes nommés persistants                                           │
# │ Préfixe `wourri_` : évite collisions avec d'autres projets Docker.   │
# ╰──────────────────────────────────────────────────────────────────────╯
volumes:
  # Note : `pgdata_prod` retire (issue #218) au profit d'un bind-mount
  # vers /srv/wourri/data/postgres (cf. service postgres ci-dessus).
  # Les autres volumes restent nommes car n'ont pas le meme besoin de
  # visibilite/backup ad-hoc.
  hf_cache:
    name: wourri_hf_cache
  audio_output:
    name: wourri_audio_output
  # api_logs : rétention bornée par la purge in-app (issue #215, ADR-0025) —
  # logs applicatifs 30 j, feedback pseudonymisé 365 j. Politique complète :
  # docs/compliance/artci-logs.md.
  api_logs:
    name: wourri_api_logs
  wa_auth:
    name: wourri_wa_auth
  wa_audio_cache:
    name: wourri_wa_audio_cache
  wa_data:
    name: wourri_wa_data
  # wa_logs : aucun écrivain (pino → stdout) — conservé tant que l'image wa
  # déclare VOLUME /app/logs (cf. service whatsapp-server, ADR-0025).
  wa_logs:
    name: wourri_wa_logs

# ╭──────────────────────────────────────────────────────────────────────╮
# │ Docker secrets (issue #213)                                          │
# │ Les fichiers vivent dans /srv/wourri/secrets/ (mode 0600 root:root). │
# │ Docker les monte read-only dans /run/secrets/<nom> côté container.   │
# │ → INVISIBLES dans `docker inspect`, `/proc/<pid>/environ`.           │
# │ Création des fichiers sur la VM : cf. docs/deployment.md §5b.        │
# ╰──────────────────────────────────────────────────────────────────────╯
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  # api_secret_key : partagé wouri-api + whatsapp-server (#257, alias
  # `wouri_api_key` via source/target au niveau du service). ⚠ Compose
  # non-swarm bind-monte le fichier AVEC ses permissions hôte : les deux
  # conteneurs tournent en uid 1000 (`wourri`, `node`) → le fichier doit
  # être root:1000 mode 0640 (cf. deployment.md §5b), PAS 0600 root:root.
  api_secret_key:
    file: ./secrets/api_secret_key
  # Issue #259 : cle precedente pour rotation dual-key. Le fichier DOIT
  # exister (compose refuse un secret manquant) → cree VIDE a l'installation
  # (deployment.md §5b) et rempli uniquement pendant une fenetre de rotation.
  api_secret_key_previous:
    file: ./secrets/api_secret_key_previous

# ╭──────────────────────────────────────────────────────────────────────╮
# │ Réseau interne — isolation des services entre eux                    │
# ╰──────────────────────────────────────────────────────────────────────╯
networks:
  wourri_net:
    name: wourri_net
    driver: bridge
