<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WOURI — Connexion Baoulé</title>
  <link rel="stylesheet" href="/static/admin/baoule.css"/>
</head>
<body class="login-body">
  <main class="login-card">
    <h1>Provider Baoulé</h1>
    <p class="hint">Compte utilisateur + mot de passe (pas la clé API moteur).</p>
    {% if err %}
    <p class="err">{{ err }}</p>
    {% endif %}
    <form method="post" action="/admin/baoule/login">
      <label>Utilisateur
        <input name="username" autocomplete="username" required/>
      </label>
      <label>Mot de passe
        <input name="password" type="password" autocomplete="current-password" required minlength="8"/>
      </label>
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
