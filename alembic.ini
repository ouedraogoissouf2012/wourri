# Wourri — Alembic configuration (Sprint F Phase B — ADR-0008)
#
# La chaîne de connexion `sqlalchemy.url` est volontairement laissée vide :
# elle est injectée dynamiquement par `alembic/env.py` à partir de la variable
# d'environnement `POSTGRES_URL` (voir `.env.example`).
#
# Usage standard :
#   cd wouri-api
#   alembic upgrade head             # applique toutes les migrations
#   alembic current                  # version actuelle de la BDD
#   alembic history                  # historique des migrations
#   alembic downgrade -1             # revert d'une migration

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# Hooks désactivés pour Phase B (aucun formateur requis sur les migrations).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
